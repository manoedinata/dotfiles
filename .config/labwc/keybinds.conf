# Cheatsheet for DMS, written in sway syntax because DMS has no labwc provider.
# Generated from ~/.config/labwc/rc.xml. Not read by labwc.

bindsym Super+d exec Apps: App launcher
bindsym Super+space exec Apps: App launcher
bindsym Super+t exec Apps: Terminal
bindsym Super+x exec System: Power menu
bindsym Super+p exec Outputs: Display mode
bindsym Super+Shift+m exec Outputs: Toggle mirror display
bindsym Super+Shift+p exec Outputs: Monitors off/on
bindsym Super+Alt+l exec System: Lock screen
bindsym Super+Alt+s exec System: Toggle Orca screen reader
bindsym Super+Shift+slash exec System: Keyboard shortcuts
bindsym Super+Escape exec System: Toggle compositor shortcuts
bindsym Super+Shift+e exec System: Quit labwc
bindsym Ctrl+Alt+Delete exec System: Quit labwc
bindsym Super+q exec Windows: Close window
bindsym Super+f exec Windows: Maximize
bindsym Super+m exec Windows: Maximize
bindsym Super+Ctrl+f exec Windows: Maximize
bindsym Super+Shift+f exec Windows: Fullscreen
bindsym Super+c exec Windows: Center window
bindsym Super+Left exec Windows: Previous window
bindsym Super+Up exec Windows: Previous window
bindsym Super+h exec Windows: Previous window
bindsym Super+k exec Outputs: Cast to wireless display
bindsym Super+Right exec Windows: Next window
bindsym Super+Down exec Windows: Next window
bindsym Super+l exec Windows: Next window
bindsym Super+j exec Windows: Next window
bindsym Super+Ctrl+Left exec Windows: Snap window left
bindsym Super+Shift+Left exec Outputs: Focus monitor left
bindsym Super+Shift+Ctrl+Left exec Outputs: Move window to monitor left
bindsym Super+Ctrl+Right exec Windows: Snap window right
bindsym Super+Shift+Right exec Outputs: Focus monitor right
bindsym Super+Shift+Ctrl+Right exec Outputs: Move window to monitor right
bindsym Super+Ctrl+Up exec Windows: Snap window up
bindsym Super+Shift+Up exec Outputs: Focus monitor up
bindsym Super+Shift+Ctrl+Up exec Outputs: Move window to monitor up
bindsym Super+Ctrl+Down exec Windows: Snap window down
bindsym Super+Shift+Down exec Outputs: Focus monitor down
bindsym Super+Shift+Ctrl+Down exec Outputs: Move window to monitor down
bindsym Super+Ctrl+h exec Windows: Snap window left
bindsym Super+Shift+h exec Outputs: Focus monitor left
bindsym Super+Shift+Ctrl+h exec Outputs: Move window to monitor left
bindsym Super+Ctrl+l exec Windows: Snap window right
bindsym Super+Shift+l exec Outputs: Focus monitor right
bindsym Super+Shift+Ctrl+l exec Outputs: Move window to monitor right
bindsym Super+Ctrl+k exec Windows: Snap window up
bindsym Super+Shift+k exec Outputs: Focus monitor up
bindsym Super+Shift+Ctrl+k exec Outputs: Move window to monitor up
bindsym Super+Ctrl+j exec Windows: Snap window down
bindsym Super+Shift+j exec Outputs: Focus monitor down
bindsym Super+Shift+Ctrl+j exec Outputs: Move window to monitor down
bindsym Super+Ctrl+Home exec Windows: Move to left edge
bindsym Super+Ctrl+End exec Windows: Move to right edge
bindsym Super+minus exec Windows: Narrower 10%
bindsym Super+equal exec Windows: Wider 10%
bindsym Super+Shift+minus exec Windows: Shorter 10%
bindsym Super+Shift+equal exec Windows: Taller 10%
bindsym Super+1 exec Workspaces: Workspace 1
bindsym Super+Ctrl+1 exec Workspaces: Send window to workspace 1
bindsym Super+Shift+1 exec Workspaces: Send window to workspace 1
bindsym Super+2 exec Workspaces: Workspace 2
bindsym Super+Ctrl+2 exec Workspaces: Send window to workspace 2
bindsym Super+Shift+2 exec Workspaces: Send window to workspace 2
bindsym Super+Next exec Workspaces: Next workspace
bindsym Super+u exec Workspaces: Next workspace
bindsym Super+Prior exec Workspaces: Previous workspace
bindsym Super+i exec Workspaces: Previous workspace
bindsym Super+Ctrl+Next exec Workspaces: Send window to next workspace
bindsym Super+Ctrl+u exec Workspaces: Send window to next workspace
bindsym Super+Ctrl+Prior exec Workspaces: Send window to previous workspace
bindsym Super+Ctrl+i exec Workspaces: Send window to previous workspace
bindsym XF86MonBrightnessUp exec Media: Brightness up
bindsym XF86MonBrightnessDown exec Media: Brightness down
bindsym XF86AudioRaiseVolume exec Media: Volume up
bindsym XF86AudioLowerVolume exec Media: Volume down
bindsym XF86AudioMute exec Media: Mute
bindsym XF86AudioMicMute exec Media: Mic mute
bindsym XF86AudioPlay exec Media: Play/pause
bindsym XF86AudioStop exec Media: Stop
bindsym XF86AudioPrev exec Media: Previous track
bindsym XF86AudioNext exec Media: Next track
bindsym Print exec Media: Screenshot region
bindsym Super+Shift+s exec Media: Screenshot region (laptop PrtSc key)
bindsym Ctrl+Print exec Media: Screenshot screen
bindsym Alt+Print exec Media: Screenshot window
